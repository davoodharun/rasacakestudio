# CI/CD: Deploy static site on push to main
# Use with GitHub Pages (enable in repo Settings → Pages → Source: GitHub Actions)
# Or add a step to deploy to Netlify/Vercel via their CLI or API

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # Optional: use a custom domain
          # cname: yourdomain.com
